<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecciones Financieras & BI | Horizon Ledger ERP</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .grid-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(15, 23, 42, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, 0.04) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, black 20%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, black 20%, transparent 85%);
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .card-hover-fx {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover-fx:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px -4px rgba(15, 23, 42, 0.1), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
    }
  </style>
</head>
<body class="bg-[#eef2f6] text-slate-900 min-h-screen flex flex-col p-3 sm:p-4 text-xs gap-3 relative selection:bg-sky-500 selection:text-white">

  <!-- Retícula de fondo sutil -->
  <div class="grid-vignette"></div>

  <!-- HEADER INSTITUCIONAL HORIZON LEDGER -->
  <header class="flex items-center justify-between gap-4 bg-white border border-slate-200 rounded-2xl px-5 py-3 shadow-[0_4px_20px_-2px_rgba(15,23,42,0.07)] relative z-20 flex-shrink-0">
    
    <!-- Lado Izquierdo: Retorno + Marca + Título -->
    <div class="flex items-center gap-4">
      <!-- Retorno a Bancos & Lobby -->
      <div class="flex items-center gap-1.5">
        <a href="/bancos" class="w-8 h-8 rounded-xl bg-slate-950 flex items-center justify-center text-white font-bold text-xs hover:bg-slate-800 transition-all shadow-xs" title="Volver a Tesorería & Bancos">
          &larr;
        </a>
        <a href="/" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-700 font-bold text-xs transition-all border border-slate-200" title="Ir al Lobby Principal">
          🏠
        </a>
      </div>

      <!-- Identidad del ERP -->
      <div class="flex items-center gap-2 border-r border-slate-200 pr-4">
        <div class="w-6 h-6 rounded-lg bg-slate-950 flex items-center justify-center text-white font-black text-[10px]">
          HL
        </div>
        <div class="flex flex-col leading-none">
          <span class="font-extrabold text-xs tracking-tight text-slate-950">Horizon Ledger</span>
          <span class="text-[8.5px] font-mono uppercase text-slate-400 font-bold">ERP</span>
        </div>
      </div>

      <!-- Título y Badge Funcional Sky -->
      <div class="flex items-center gap-2.5">
        <h1 class="text-sm font-extrabold text-slate-900 uppercase tracking-tight">Proyecciones Financieras & Logística Operativa</h1>
        <span class="font-mono text-[9px] font-bold px-2 py-0.5 rounded-md bg-sky-50 text-sky-700 border border-sky-200 tracking-wider flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span>
          BI STUDIO v2.0
        </span>
      </div>
    </div>

    <!-- Lado Derecho: Filtro Temporal Global + Perfil -->
    <div class="flex items-center gap-3">
      <!-- Selector de Período Temporal -->
      <div class="hidden md:flex items-center gap-1.5 px-3 py-1 bg-slate-50 border border-slate-200 rounded-xl font-mono text-[11px] text-slate-700">
        <span class="text-slate-400 text-[10px]">HORIZONTE:</span>
        <select id="select-global-period" onchange="updateGlobalPeriod(this.value)" class="bg-transparent font-bold text-slate-900 outline-none cursor-pointer">
          <option value="MES_ACTUAL">Mes Actual (Septiembre 2026)</option>
          <option value="TRIMESTRE_Q3" selected>Trimestre Q3 2026</option>
          <option value="ANIO_2026">Año Fiscal 2026</option>
          <option value="PROYECCION_2027">Proyección Anual 2027</option>
        </select>
      </div>

      <!-- Perfil de Usuario -->
      <div class="flex items-center gap-2 pl-2 border-l border-slate-200">
        <div class="w-7 h-7 rounded-full bg-sky-100 border border-sky-300 text-sky-700 flex items-center justify-center font-bold text-xs">
          CH
        </div>
        <div class="hidden lg:flex flex-col text-left leading-tight">
          <span class="text-xs font-bold text-slate-900">Carlos Hernández</span>
          <span class="text-[9.5px] text-slate-400 font-medium">Auditor Financiero & BI</span>
        </div>
      </div>
    </div>

  </header>

  <!-- 1. BARRA DE CONTROL DE FORMATO Y HERRAMIENTAS DE ESTUDIO (GRID LAYOUT) -->
  <section class="bg-white border border-slate-200 rounded-2xl px-5 py-3 shadow-[0_4px_20px_-2px_rgba(15,23,42,0.07)] flex flex-col md:flex-row items-center justify-between gap-3 relative z-10 flex-shrink-0">
    
    <!-- Selector de Distribución del Lienzo (Grid Formats) -->
    <div class="flex items-center gap-2.5 flex-wrap">
      <span class="text-[11px] font-extrabold text-slate-700 uppercase font-mono tracking-wider flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-sky-500"></span>
        DISTRIBUCIÓN DEL LIENZO:
      </span>

      <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 gap-1" id="grid-layout-buttons">
        <button onclick="setGridLayout('2x2')" id="btn-grid-2x2" class="px-3 py-1.5 rounded-lg font-bold font-mono text-[11px] transition-all bg-white text-slate-950 shadow-xs border border-slate-200/80">
          2x2 (4 Gráficos)
        </button>
        <button onclick="setGridLayout('3x2')" id="btn-grid-3x2" class="px-3 py-1.5 rounded-lg font-semibold font-mono text-[11px] text-slate-600 hover:text-slate-950 hover:bg-slate-200/60 transition-all">
          3x2 (6 Gráficos)
        </button>
        <button onclick="setGridLayout('4x2')" id="btn-grid-4x2" class="px-3 py-1.5 rounded-lg font-semibold font-mono text-[11px] text-slate-600 hover:text-slate-950 hover:bg-slate-200/60 transition-all">
          4x2 (8 Gráficos)
        </button>
        <button onclick="setGridLayout('5x2')" id="btn-grid-5x2" class="px-3 py-1.5 rounded-lg font-semibold font-mono text-[11px] text-slate-600 hover:text-slate-950 hover:bg-slate-200/60 transition-all">
          5x2 (10 Gráficos)
        </button>
      </div>
    </div>

    <!-- Botonera de Acciones del Estudio BI -->
    <div class="flex items-center gap-2">
      <!-- Botón de Actualizar / Refrescar -->
      <button onclick="refreshAllWidgets()" class="px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold border border-slate-200 flex items-center gap-1.5 transition-all text-[11px] shadow-xs" title="Actualizar datos de indicadores">
        <span>🔄</span>
        <span class="hidden sm:inline">Refrescar</span>
      </button>

      <!-- Guardar Plantilla -->
      <button onclick="saveDashboardLayout()" class="px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold border border-slate-200 flex items-center gap-1.5 transition-all text-[11px] shadow-xs" title="Guardar personalización del lienzo">
        <span>💾</span>
        <span class="hidden sm:inline">Guardar</span>
      </button>

      <!-- Restablecer Predeterminado -->
      <button onclick="resetDefaultLayout()" class="px-2.5 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-500 hover:text-slate-800 font-bold border border-slate-200 flex items-center gap-1 transition-all text-[11px]" title="Restablecer plantilla inicial">
        <span>↺</span>
      </button>

      <!-- Exportar Reporte BI -->
      <button onclick="exportBiReport()" class="px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold flex items-center gap-1.5 transition-all text-[11px] shadow-xs shadow-sky-600/30">
        <span>📑</span>
        <span>Exportar Reporte</span>
      </button>
    </div>

  </section>

  <!-- 2. LIENZO DINÁMICO DE RANURAS (DASHBOARD GRID) -->
  <main class="flex-1 relative z-10">
    <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3.5 transition-all">
      <!-- Las ranuras (Slots) se renderizan dinámicamente vía renderSlots() -->
    </div>
  </main>

  <!-- 3. MODAL CATÁLOGO DE MÉTRICAS Y WIDGETS -->
  <div id="modal-widget-catalog" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 rounded-3xl shadow-2xl max-w-3xl w-full p-6 space-y-4 max-h-[90vh] flex flex-col">
      
      <!-- Cabecera del Modal -->
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-2xl bg-sky-100 border border-sky-300 text-sky-700 flex items-center justify-center font-bold text-base">
            📊
          </div>
          <div>
            <h3 class="font-extrabold text-slate-900 text-sm tracking-tight">Catálogo de Indicadores & Métricas BI</h3>
            <p class="text-[11px] text-slate-400">Seleccione el gráfico que desea anclar a la ranura <strong id="catalog-target-slot-label" class="font-mono text-slate-700">#1</strong></p>
          </div>
        </div>
        <button onclick="closeWidgetCatalog()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center transition-colors">
          &times;
        </button>
      </div>

      <!-- Filtro y Categorías -->
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <!-- Buscador -->
        <div class="relative flex-1 min-w-[200px]">
          <input type="text" id="catalog-search" oninput="filterCatalogItems()" placeholder="Buscar métrica por nombre o concepto..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-900 placeholder:text-slate-400 outline-none focus:bg-white focus:border-slate-800">
          <span class="absolute left-2.5 top-2 text-slate-400">🔍</span>
        </div>

        <!-- Pestañas de Categoría -->
        <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 gap-1 text-[11px]">
          <button onclick="filterCatalogCategory('ALL')" id="cat-btn-ALL" class="px-2.5 py-1 rounded-lg font-bold bg-white text-slate-900 shadow-xs">Todos</button>
          <button onclick="filterCatalogCategory('FIN')" id="cat-btn-FIN" class="px-2.5 py-1 rounded-lg font-semibold text-slate-600 hover:text-slate-900">Finanzas</button>
          <button onclick="filterCatalogCategory('LOG')" id="cat-btn-LOG" class="px-2.5 py-1 rounded-lg font-semibold text-slate-600 hover:text-slate-900">Logística & Stock</button>
          <button onclick="filterCatalogCategory('SALES')" id="cat-btn-SALES" class="px-2.5 py-1 rounded-lg font-semibold text-slate-600 hover:text-slate-900">Ventas & Margen</button>
        </div>
      </div>

      <!-- Lista de Métricas Disponibles -->
      <div class="flex-1 overflow-y-auto space-y-2.5 pr-1 max-h-[440px]" id="catalog-items-container">
        <!-- Generado dinámicamente -->
      </div>

      <!-- Pie del Modal -->
      <div class="flex justify-end pt-2 border-t border-slate-100">
        <button onclick="closeWidgetCatalog()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs transition-colors">
          Cerrar
        </button>
      </div>

    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 bg-white text-slate-900 border-slate-200 text-xs font-bold">
    <span id="toast-icon">⚡</span>
    <span id="toast-message">Notificación del sistema</span>
  </div>

  <!-- MOTOR JAVASCRIPT: STUDIO DE PROYECCIONES Y CHART.JS -->

              datasets: [{
                data: [45, 18, 15, 12, 10],
                backgroundColor: ['rgba(14, 165, 233, 0.7)', 'rgba(99, 102, 241, 0.7)', 'rgba(245, 158, 11, 0.7)', 'rgba(244, 63, 94, 0.7)', 'rgba(16, 185, 129, 0.7)']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { family: 'Plus Jakarta Sans', size: 9 } } } },
              scales: { r: { ticks: { display: false } } }
            }
          });
        }
      },
      {
        id: 'WIDGET_GROSS_MARGIN',
        category: 'SALES',
        categoryLabel: 'Rentabilidad & Margen',
        badgeColor: 'amber',
        title: 'Margen Bruto por Familia de Productos',
        description: 'Margen de contribución real tras descontar costo de venta (CPP).',
        kpiHighlight: '38.6% Margen Global',
        kpiSubtext: 'Línea Serv: 62% Margen',
        defaultType: 'bar',
        generateChart: (ctx, type) => {
          return new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Laptops', 'Periféricos', 'Servicios TI', 'Licencias', 'Redes'],
              datasets: [{
                label: 'Margen Bruto (%)',
                data: [24, 38, 62, 45, 32],
                backgroundColor: '#f59e0b',
                borderRadius: 5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { y: { ticks: { font: { family: 'JetBrains Mono', size: 9 }, callback: v => v + '%' }, grid: { color: '#f1f5f9' } }, x: { ticks: { font: { family: 'Plus Jakarta Sans', size: 10 } }, grid: { display: false } } }
            }
          });
        }
      },
      {
        id: 'WIDGET_ACH_PAYMENTS_FORECAST',
        category: 'FIN',
        categoryLabel: 'Tesorería ACH',
        badgeColor: 'sky',
        title: 'Cronograma Semanal de Desembolsos ACH',
        description: 'Calendario de vencimientos de lotes de pago bancario a proveedores.',
        kpiHighlight: 'L 380,000 Próx. Semana',
        kpiSubtext: '12 Facturas programadas',
        defaultType: 'bar',
        generateChart: (ctx, type) => {
          return new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Sem 38', 'Sem 39', 'Sem 40', 'Sem 41', 'Sem 42'],
              datasets: [{
                label: 'Desembolsos Programados (L)',
                data: [380000, 240000, 490000, 180000, 310000],
                backgroundColor: '#0284c7',
                borderRadius: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { y: { ticks: { font: { family: 'JetBrains Mono', size: 9 }, callback: v => 'L ' + (v/1000) + 'k' }, grid: { color: '#f1f5f9' } }, x: { ticks: { font: { family: 'JetBrains Mono', size: 9 } }, grid: { display: false } } }
            }
          });
        }
      },
      {
        id: 'WIDGET_IMPORT_LEAD_TIME',
        category: 'LOG',
        categoryLabel: 'Comercio Exterior DUA',
        badgeColor: 'indigo',
        title: 'Lead Time de Importaciones & Aduana',
        description: 'Tiempo transcurrido desde embarque FOB hasta ingreso al Kardex central.',
        kpiHighlight: '18 Días Promedio',
        kpiSubtext: 'Aduana Cortés: 3.2 días',
        defaultType: 'line',
        generateChart: (ctx, type) => {
          return new Chart(ctx, {
            type: 'line',
            data: {
              labels: ['Lote 88', 'Lote 89', 'Lote 90', 'Lote 91', 'Lote 92', 'Lote 93'],
              datasets: [{
                label: 'Días Tránsito Total',
                data: [24, 21, 19, 18, 17, 18],
                borderColor: '#6366f1',
                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                tension: 0.3,
                fill: true
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { y: { ticks: { font: { family: 'JetBrains Mono', size: 9 }, callback: v => v + ' d' }, grid: { color: '#f1f5f9' } }, x: { ticks: { font: { family: 'JetBrains Mono', size: 9 } }, grid: { display: false } } }
            }
          });
        }
      }
    ];

    // =======================================================
    // 2. ESTADO DEL LIENZO Y GESTIÓN DE RANURAS (SLOTS)
    // =======================================================
    window.currentGridConfig = '2x2'; // '2x2', '3x2', '4x2', '5x2'
    window.totalSlots = 4;
    window.activeSlots = [
      'WIDGET_CASH_FLOW',
      'WIDGET_BANK_AVAILABILITY',
      'WIDGET_COLLECTIONS_VS_PAYMENTS',
      'WIDGET_INVENTORY_ROTATION'
    ];
    
    // Instancias de Chart.js activas
    window.chartInstances = {};
    window.targetSlotForCatalog = null;
    window.activeCategoryFilter = 'ALL';

    // =======================================================
    // 3. CAMBIO DE DISTRIBUCIÓN DEL LIENZO (GRID FORMAT)
    // =======================================================
    window.setGridLayout = function(format) {
      window.currentGridConfig = format;
      const gridElem = document.getElementById('dashboard-grid');
      const buttons = document.querySelectorAll('#grid-layout-buttons button');

      buttons.forEach(btn => {
        btn.className = "px-3 py-1.5 rounded-lg font-semibold font-mono text-[11px] text-slate-600 hover:text-slate-950 hover:bg-slate-200/60 transition-all";
      });

      const activeBtn = document.getElementById(`btn-grid-${format}`);
      if (activeBtn) {
        activeBtn.className = "px-3 py-1.5 rounded-lg font-bold font-mono text-[11px] transition-all bg-white text-slate-950 shadow-xs border border-slate-200/80";
      }

      // Configurar columnas según el formato
      if (format === '2x2') {
        window.totalSlots = 4;
        gridElem.className = "grid grid-cols-1 md:grid-cols-2 gap-3.5 transition-all";
      } else if (format === '3x2') {
        window.totalSlots = 6;
        gridElem.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 transition-all";
      } else if (format === '4x2') {
        window.totalSlots = 8;
        gridElem.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3.5 transition-all";
      } else if (format === '5x2') {
        window.totalSlots = 10;
        gridElem.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-3.5 transition-all";
      }

      // Ajustar arreglo de ranuras
      while (window.activeSlots.length < window.totalSlots) {
        window.activeSlots.push(null);
      }
      if (window.activeSlots.length > window.totalSlots) {
        window.activeSlots = window.activeSlots.slice(0, window.totalSlots);
      }

      window.renderSlots();
      showToast(`Lienzo ajustado a formato ${format} (${window.totalSlots} ranuras).`, 'info');
    };

    // =======================================================
    // 4. RENDERIZADO REACTIVO DE RANURAS (SLOTS)
    // =======================================================
    window.renderSlots = function() {
      const gridElem = document.getElementById('dashboard-grid');
      if (!gridElem) return;

      // Destruir instancias previas de Chart.js
      Object.keys(window.chartInstances).forEach(key => {
        if (window.chartInstances[key]) {
          window.chartInstances[key].destroy();
        }
      });
      window.chartInstances = {};

      gridElem.innerHTML = '';

      for (let i = 0; i < window.totalSlots; i++) {
        const widgetId = window.activeSlots[i];

        if (!widgetId) {
          // ESTADO DE RANURA VACÍA (EXACTO SEGÚN ESPECIFICACIÓN)
          const emptySlotDiv = document.createElement('div');
          emptySlotDiv.className = "h-80 bg-white/60 hover:bg-white border-2 border-dashed border-slate-200 hover:border-sky-500 rounded-2xl flex flex-col items-center justify-center gap-2 cursor-pointer transition-all group p-6 text-center shadow-xs";
          emptySlotDiv.onclick = () => window.openWidgetCatalog(i);
          emptySlotDiv.innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-slate-50 group-hover:bg-sky-50 text-slate-400 group-hover:text-sky-700 flex items-center justify-center font-mono font-black text-2xl transition-colors border border-slate-200/80">
              +
            </div>
            <p class="text-xs font-extrabold text-slate-700 group-hover:text-sky-900 font-mono tracking-wider uppercase">Añadir Métrica / Gráfico</p>
            <span class="text-[11px] text-slate-400">Seleccionar indicador de Finanzas o Logística (Ranura #${i + 1})</span>
          `;
          gridElem.appendChild(emptySlotDiv);
        } else {
          // ESTADO DE RANURA CON WIDGET ASIGNADO
          const widgetDef = window.WIDGET_CATALOG.find(w => w.id === widgetId);
          if (!widgetDef) continue;

          const widgetCard = document.createElement('div');
          widgetCard.className = "h-80 bg-white border border-slate-200 rounded-2xl p-4 shadow-[0_4px_20px_-2px_rgba(15,23,42,0.07)] flex flex-col justify-between card-hover-fx relative overflow-hidden";
          
          widgetCard.innerHTML = `
            <!-- Header de la tarjeta del widget -->
            <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-2.5">
              <div>
                <div class="flex items-center gap-1.5 mb-0.5">
                  <span class="text-[9px] font-mono font-bold px-1.5 py-0.2 rounded uppercase bg-slate-100 text-slate-600">${widgetDef.categoryLabel}</span>
                  <span class="text-[9px] font-mono text-slate-400">Slot #${i + 1}</span>
                </div>
                <h3 class="font-extrabold text-slate-900 text-xs truncate max-w-[210px]" title="${widgetDef.title}">${widgetDef.title}</h3>
              </div>

              <!-- Controles del Widget -->
              <div class="flex items-center gap-1">
                <!-- Selector de Tipo -->
                <button onclick="changeWidgetChartType(${i})" class="w-6 h-6 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center text-[10px] transition-colors border border-slate-200" title="Cambiar tipo de gráfico">
                  📈
                </button>
                <!-- Cambiar Métrica -->
                <button onclick="window.openWidgetCatalog(${i})" class="w-6 h-6 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center text-[10px] transition-colors border border-slate-200" title="Reemplazar métrica">
                  🔄
                </button>
                <!-- Quitar Ranura -->
                <button onclick="clearSlot(${i})" class="w-6 h-6 rounded-lg bg-slate-50 hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center text-[11px] font-bold transition-colors border border-slate-200" title="Liberar ranura">
                  &times;
                </button>
              </div>
            </div>

            <!-- Resumen KPI Rápido -->
            <div class="flex items-baseline justify-between pt-1">
              <span class="font-mono font-bold text-slate-900 text-sm tracking-tight">${widgetDef.kpiHighlight}</span>
              <span class="text-[10px] text-slate-500 font-medium">${widgetDef.kpiSubtext}</span>
            </div>

            <!-- Canvas de Chart.js -->
            <div class="flex-1 relative w-full min-h-[160px] max-h-[175px] my-1">
              <canvas id="chart-canvas-${i}"></canvas>
            </div>
          `;

          gridElem.appendChild(widgetCard);

          // Inicializar Chart.js en el siguiente tick
          setTimeout(() => {
            const canvas = document.getElementById(`chart-canvas-${i}`);
            if (canvas) {
              const ctx = canvas.getContext('2d');
              window.chartInstances[i] = widgetDef.generateChart(ctx, widgetDef.defaultType);
            }
          }, 0);
        }
      }
    };

    // =======================================================
    // 5. CATÁLOGO MODAL Y SELECCIÓN DE MÉTRICAS
    // =======================================================
    window.openWidgetCatalog = function(slotIndex) {
      window.targetSlotForCatalog = slotIndex;
      document.getElementById('catalog-target-slot-label').textContent = `#${slotIndex + 1}`;
      document.getElementById('modal-widget-catalog').classList.remove('hidden');
      renderCatalogList();
    };

    window.closeWidgetCatalog = function() {
      document.getElementById('modal-widget-catalog').classList.add('hidden');
      window.targetSlotForCatalog = null;
    };

    function renderCatalogList() {
      const container = document.getElementById('catalog-items-container');
      const searchQuery = (document.getElementById('catalog-search').value || '').toLowerCase();
      
      container.innerHTML = '';

      const filtered = window.WIDGET_CATALOG.filter(w => {
        const matchesCategory = window.activeCategoryFilter === 'ALL' || w.category === window.activeCategoryFilter;
        const matchesSearch = w.title.toLowerCase().includes(searchQuery) || w.description.toLowerCase().includes(searchQuery) || w.categoryLabel.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 font-mono text-xs">No se encontraron métricas con ese criterio.</div>`;
        return;
      }

      filtered.forEach(item => {
        const isAssigned = window.activeSlots.includes(item.id);
        const div = document.createElement('div');
        div.className = "p-3 rounded-2xl border border-slate-200 hover:border-sky-400 bg-slate-50/50 hover:bg-white transition-all flex items-center justify-between gap-3 shadow-2xs";

        div.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-white border border-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm shadow-xs flex-shrink-0">
              📊
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="font-mono text-[9px] font-bold px-2 py-0.5 rounded bg-sky-100 text-sky-800">${item.categoryLabel}</span>
                <span class="font-extrabold text-slate-900 text-xs">${item.title}</span>
              </div>
              <p class="text-[11px] text-slate-500 mt-0.5">${item.description}</p>
              <div class="mt-1 flex items-center gap-2 text-[10px] font-mono">
                <strong class="text-slate-800">${item.kpiHighlight}</strong>
                <span class="text-slate-400">• ${item.kpiSubtext}</span>
              </div>
            </div>
          </div>

          <button onclick="selectWidgetForSlot('${item.id}')" class="px-3.5 py-1.5 rounded-xl font-bold text-xs transition-all flex-shrink-0 ${isAssigned ? 'bg-slate-200 text-slate-700 hover:bg-sky-600 hover:text-white' : 'bg-slate-950 hover:bg-slate-800 text-white shadow-xs'}">
            ${isAssigned ? 'Reasignar' : 'Seleccionar'}
          </button>
        `;

        container.appendChild(div);
      });
    }

    window.selectWidgetForSlot = function(widgetId) {
      if (window.targetSlotForCatalog !== null) {
        window.activeSlots[window.targetSlotForCatalog] = widgetId;
        window.closeWidgetCatalog();
        window.renderSlots();
        showToast(`Métrica anclada en la ranura #${window.targetSlotForCatalog + 1}.`, 'success');
      }
    };

    window.clearSlot = function(slotIndex) {
      window.activeSlots[slotIndex] = null;
      window.renderSlots();
      showToast(`Ranura #${slotIndex + 1} liberada.`, 'info');
    };

    window.changeWidgetChartType = function(slotIndex) {
      const widgetId = window.activeSlots[slotIndex];
      const widgetDef = window.WIDGET_CATALOG.find(w => w.id === widgetId);
      if (!widgetDef) return;

      const types = ['bar', 'line', 'doughnut'];
      const currentIdx = types.indexOf(widgetDef.defaultType);
      widgetDef.defaultType = types[(currentIdx + 1) % types.length];

      window.renderSlots();
      showToast(`Tipo de gráfico cambiado a: ${widgetDef.defaultType.toUpperCase()}`, 'info');
    };

    window.filterCatalogCategory = function(cat) {
      window.activeCategoryFilter = cat;
      const btns = ['ALL', 'FIN', 'LOG', 'SALES'];
      btns.forEach(b => {
        const el = document.getElementById(`cat-btn-${b}`);
        if (el) {
          el.className = b === cat 
            ? "px-2.5 py-1 rounded-lg font-bold bg-white text-slate-900 shadow-xs" 
            : "px-2.5 py-1 rounded-lg font-semibold text-slate-600 hover:text-slate-900";
        }
      });
      renderCatalogList();
    };

    window.filterCatalogItems = function() {
      renderCatalogList();
    };

    // =======================================================
    // 6. ACCIONES GLOBALES Y PERSISTENCIA
    // =======================================================
    window.refreshAllWidgets = function() {
      window.renderSlots();
      showToast('Indicadores actualizados con datos en tiempo real.', 'success');
    };

    window.saveDashboardLayout = function() {
      const state = {
        gridConfig: window.currentGridConfig,
        activeSlots: window.activeSlots
      };
      localStorage.setItem('hl_bi_dashboard_studio', JSON.stringify(state));
      showToast('Plantilla personalizada guardada en memoria local.', 'success');
    };

    window.resetDefaultLayout = function() {
      localStorage.removeItem('hl_bi_dashboard_studio');
      window.activeSlots = [
        'WIDGET_CASH_FLOW',
        'WIDGET_BANK_AVAILABILITY',
        'WIDGET_COLLECTIONS_VS_PAYMENTS',
        'WIDGET_INVENTORY_ROTATION'
      ];
      window.setGridLayout('2x2');
      showToast('Lienzo restablecido a la configuración ejecutiva por defecto.', 'info');
    };

    window.updateGlobalPeriod = function(period) {
      showToast(`Horizonte temporal ajustado a: ${period}`, 'info');
      window.refreshAllWidgets();
    };

    window.exportBiReport = function() {
      showToast('Generando reporte consolidado de Business Intelligence...', 'info');
      setTimeout(() => {
        showToast('Reporte BI exportado exitosamente a PDF.', 'success');
      }, 1000);
    };

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-message');

      text.textContent = msg;
      if (type === 'success') {
        icon.textContent = '✓';
        toast.className = 'fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 bg-emerald-900 text-white border-emerald-700 text-xs font-bold';
      } else if (type === 'warning') {
        icon.textContent = '⚠️';
        toast.className = 'fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 bg-amber-900 text-white border-amber-700 text-xs font-bold';
      } else {
        icon.textContent = 'ℹ️';
        toast.className = 'fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 bg-slate-900 text-white border-slate-700 text-xs font-bold';
      }

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3500);
    }

    // =======================================================
    // 7. INICIALIZACIÓN
    // =======================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Cargar configuración guardada si existe
      try {
        const saved = localStorage.getItem('hl_bi_dashboard_studio');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.gridConfig && parsed.activeSlots) {
            window.activeSlots = parsed.activeSlots;
            window.setGridLayout(parsed.gridConfig);
            return;
          }
        }
      } catch (e) {
        console.warn('Error reading saved layout:', e);
      }

      window.setGridLayout('2x2');
    });
  </script>
</body>
</html>
