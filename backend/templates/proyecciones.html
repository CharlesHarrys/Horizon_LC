<script id="horizon-header-sync-engine">
(function() {
  function sincronizarHeaderHorizonGlobal() {
    try {
      const raw = localStorage.getItem('horizon_system_config');
      if (!raw) return;
      const config = JSON.parse(raw);

      // 1. Nombre de la Empresa
      const compName = config.empresa_nombre || (config.company && config.company.name);
      if (compName) {
        const elName = document.getElementById('hdr-company-name');
        if (elName) {
          elName.textContent = compName.toUpperCase();
          elName.setAttribute('title', compName.toUpperCase());
        }
      }

      // 2. RTN de la Empresa
      const compRtn = config.empresa_rtn || (config.company && config.company.rtn);
      if (compRtn) {
        const elRtn = document.getElementById('hdr-company-rtn');
        if (elRtn) {
          const rtnClean = compRtn.replace(/^RTN:\s*/i, '').trim();
          elRtn.textContent = 'RTN: ' + rtnClean;
        }
      }

      // 3. Periodo Contable
      const perVal = config.periodo_activo || (config.period && config.period.label);
      if (perVal) {
        const elPerText = document.getElementById('hdr-period-text');
        if (elPerText) {
          elPerText.textContent = perVal.toUpperCase();
        } else {
          const elPer = document.getElementById('hdr-period-badge');
          if (elPer) {
            elPer.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span><span id="hdr-period-text">' + perVal.toUpperCase() + '</span>';
          }
        }
      }

      // 4. Logo Vectorial o Imagen de la Empresa
      if (config.company_logo || (config.company && config.company.logo)) {
        const logoData = config.company_logo || config.company.logo;
        const logoContainer = document.getElementById('hdr-company-logo-container');
        if (logoContainer && logoData) {
          if (logoData.startsWith('<svg') || logoData.startsWith('data:image')) {
            logoContainer.innerHTML = logoData.startsWith('<svg') ? logoData : '<img src="' + logoData + '" alt="Logo" class="w-full h-full object-contain rounded-lg">';
          }
        }
      }
    } catch(err) {
      console.warn('Error sincronizando header con horizon_system_config:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sincronizarHeaderHorizonGlobal);
  } else {
    sincronizarHeaderHorizonGlobal();
  }
  window.addEventListener('pageshow', sincronizarHeaderHorizonGlobal);
  window.addEventListener('storage', function(e) {
    if (!e.key || e.key === 'horizon_system_config') {
      sincronizarHeaderHorizonGlobal();
    }
  });

  window.sincronizarHeaderHorizonGlobal = sincronizarHeaderHorizonGlobal;
})();
</script>

  <!-- MOTOR JAVASCRIPT: STUDIO DE PROYECCIONES Y CHART.JS -->
  <script>
    if (window.Chart) { Chart.defaults.font.family = "'Plus Jakarta Sans', 'Inter', sans-serif"; }

    // =======================================================
    // MOTOR HORIZON: sincronización con horizon_system_config
    // =======================================================
    window.HZ_DEFAULTS = { empresa: 'Inversiones Globales de Honduras S.A. de C.V.', rtn: '08011999123456', periodo: 'OCTUBRE 2026' };
    window.HZ_CONTEXT = Object.assign({}, window.HZ_DEFAULTS);

    window.aplicarConfiguracionHorizon = function () {
      try {
        var raw = localStorage.getItem('horizon_system_config');
        var config = raw ? JSON.parse(raw) : {};
        var empresa = config.empresa_nombre || (config.company && config.company.name) || window.HZ_DEFAULTS.empresa;
        var rtn = config.empresa_rtn || (config.company && config.company.rtn) || window.HZ_DEFAULTS.rtn;
        var periodo = config.periodo_activo || (config.period && config.period.label) || window.HZ_DEFAULTS.periodo;
        window.HZ_CONTEXT = { empresa: empresa, rtn: rtn, periodo: periodo };
        [['empresa', empresa], ['rtn', rtn], ['periodo', periodo]].forEach(function (par) {
          document.querySelectorAll('[data-hz="' + par[0] + '"]').forEach(function (el) { el.textContent = par[1]; });
        });
        window.dispatchEvent(new CustomEvent('hz:config', { detail: window.HZ_CONTEXT }));
      } catch (err) {
        console.error('Error sincronizando configuración Horizon:', err);
      }
    };

    // Navegación válida tanto desde file:// como desde FastAPI (http://)
    window.navegarHorizon = function (archivo, ruta) {
      var local = window.location.protocol === 'file:' || window.location.pathname.slice(-5) === '.html';
      window.location.href = local ? archivo : ruta;
    };

    document.addEventListener('DOMContentLoaded', window.aplicarConfiguracionHorizon);
    window.addEventListener('pageshow', window.aplicarConfiguracionHorizon);
    window.addEventListener('storage', function (e) {
      if (!e.key || e.key === 'horizon_system_config') window.aplicarConfiguracionHorizon();
    });

    // =======================================================
    // DATOS BASE PARA INDICADORES FINANCIEROS (EERR Ene-Sep 2026)
    // =======================================================
    window.HZ_BASE_FINANCIERO = { ventas: 2450800, cogs: 1225400, gastosAdm: 412000, gastosVenta: 185500, gastosFin: 42100 };

    // Punto de equilibrio operativo: variables = costo de ventas + gastos de venta; fijos = administración + financieros
    window.calcBreakeven = function () {
      var b = window.HZ_BASE_FINANCIERO;
      var cv = b.cogs + b.gastosVenta;
      var cf = b.gastosAdm + b.gastosFin;
      var cvRatio = cv / b.ventas;
      var mc = 1 - cvRatio;
      var pe = cf / mc;
      return { ventas: b.ventas, cv: cv, cf: cf, cvRatio: cvRatio, mc: mc, pe: pe, ms: (b.ventas - pe) / b.ventas };
    };

    // Ejecución presupuestaria por rubro: lee horizon_budget_data (módulo Presupuestos) o usa la base por defecto
    window.HZ_BUDGET_CATS = [
      { id: '4.1', label: 'Ingresos 4.1', egreso: false },
      { id: '5.1', label: 'Costo de Ventas 5.1', egreso: true },
      { id: '5.2', label: 'Gastos Operativos 5.2', egreso: true },
      { id: '5.3', label: 'Gastos Financieros 5.3', egreso: true },
      { id: '1.2', label: 'CAPEX 1.2', egreso: true }
    ];
    window.HZ_BUDGET_FALLBACK = { '4.1': [2300000, 2450800], '5.1': [1155000, 1225400], '5.2': [590000, 597500], '5.3': [48000, 42100], '1.2': [155000, 153800] };
    window.getBudgetRubros = function () {
      var partidas = null;
      try {

        activeBtn.className = "px-3 py-1.5 rounded-lg font-bold tabular-nums text-[11px] transition-all bg-white text-slate-950 shadow-xs border border-slate-200/80";
      }

      // Configurar columnas según el formato
      if (format === '2x2') {
        window.totalSlots = 4;
        gridElem.className = "grid grid-cols-1 md:grid-cols-2 gap-3.5 transition-all";
      } else if (format === '3x2') {
        window.totalSlots = 6;
        gridElem.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 transition-all";
      } else if (format === '4x2') {
        window.totalSlots = 8;
        gridElem.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3.5 transition-all";
      } else if (format === '5x2') {
        window.totalSlots = 10;
        gridElem.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-3.5 transition-all";
      }

      // Ajustar arreglo de ranuras
      while (window.activeSlots.length < window.totalSlots) {
        window.activeSlots.push(null);
      }
      if (window.activeSlots.length > window.totalSlots) {
        window.activeSlots = window.activeSlots.slice(0, window.totalSlots);
      }

      window.renderSlots();
      showToast(`Lienzo ajustado a formato ${format} (${window.totalSlots} ranuras).`, 'info');
    };

          emptySlotDiv.onclick = () => window.openWidgetCatalog(i);
          emptySlotDiv.innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-slate-50 group-hover:bg-sky-50 text-slate-400 group-hover:text-sky-700 flex items-center justify-center tabular-nums font-black text-2xl transition-colors border border-slate-200/80">
              +
            </div>
            <p class="text-xs font-extrabold text-slate-700 group-hover:text-sky-900 tabular-nums tracking-wider uppercase">Añadir Métrica / Gráfico</p>
            <span class="text-[11px] text-slate-400">Seleccionar indicador de Finanzas o Logística (Ranura #${i + 1})</span>
          `;
          gridElem.appendChild(emptySlotDiv);
        } else {
          // ESTADO DE RANURA CON WIDGET ASIGNADO
          const widgetDef = window.WIDGET_CATALOG.find(w => w.id === widgetId);
          if (!widgetDef) continue;

          const widgetCard = document.createElement('div');
          widgetCard.className = "h-80 bg-white border border-slate-200 rounded-2xl p-4 shadow-[0_4px_20px_-2px_rgba(15,23,42,0.07)] flex flex-col justify-between card-hover-fx relative overflow-hidden";
          
          widgetCard.innerHTML = `
            <!-- Header de la tarjeta del widget -->
            <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-2.5">
              <div>
                <div class="flex items-center gap-1.5 mb-0.5">
                  <span class="text-[9px] tabular-nums font-bold px-1.5 py-0.2 rounded uppercase bg-slate-100 text-slate-600">${widgetDef.categoryLabel}</span>
                  <span class="text-[9px] tabular-nums text-slate-400">Slot #${i + 1}</span>
                </div>
                <h3 class="font-extrabold text-slate-900 text-xs truncate max-w-[210px]" title="${widgetDef.title}">${widgetDef.title}</h3>
              </div>

              <!-- Controles del Widget -->
              <div class="flex items-center gap-1">
                <!-- Selector de Tipo -->
                <button onclick="changeWidgetChartType(${i})" class="w-6 h-6 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center text-[10px] transition-colors border border-slate-200" title="Cambiar tipo de gráfico">
                  📈
                </button>
                <!-- Cambiar Métrica -->
                <button onclick="window.openWidgetCatalog(${i})" class="w-6 h-6 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center text-[10px] transition-colors border border-slate-200" title="Reemplazar métrica">
                  🔄
                </button>
                <!-- Quitar Ranura -->
                <button onclick="clearSlot(${i})" class="w-6 h-6 rounded-lg bg-slate-50 hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center text-[11px] font-bold transition-colors border border-slate-200" title="Liberar ranura">
                  &times;
                </button>
              </div>
            </div>

            <!-- Resumen KPI Rápido -->
            <div class="flex items-baseline justify-between pt-1">
              <span class="tabular-nums font-bold text-slate-900 text-sm tracking-tight">${widgetDef.kpiHighlight}</span>
              <span class="text-[10px] text-slate-500 font-medium">${widgetDef.kpiSubtext}</span>
            </div>

            <!-- Canvas de Chart.js -->
            <div class="flex-1 relative w-full min-h-[160px] max-h-[175px] my-1">
              <canvas id="chart-canvas-${i}"></canvas>
            </div>
          `;

          gridElem.appendChild(widgetCard);

          // Inicializar Chart.js en el siguiente tick
          setTimeout(() => {
            const canvas = document.getElementById(`chart-canvas-${i}`);
            if (canvas) {
              const ctx = canvas.getContext('2d');
              window.chartInstances[i] = widgetDef.generateChart(ctx, widgetDef.defaultType);
            }
          }, 0);
        }
      }
    };

    // =======================================================
    // 5. CATÁLOGO MODAL Y SELECCIÓN DE MÉTRICAS
    // =======================================================
    window.openWidgetCatalog = function(slotIndex) {
      window.targetSlotForCatalog = slotIndex;
      document.getElementById('catalog-target-slot-label').textContent = `#${slotIndex + 1}`;
      document.getElementById('modal-widget-catalog').classList.remove('hidden');
      renderCatalogList();
    };

    window.closeWidgetCatalog = function() {
      document.getElementById('modal-widget-catalog').classList.add('hidden');
      window.targetSlotForCatalog = null;
    };

    function renderCatalogList() {
      const container = document.getElementById('catalog-items-container');
      const searchQuery = (document.getElementById('catalog-search').value || '').toLowerCase();
      
      container.innerHTML = '';

      const filtered = window.WIDGET_CATALOG.filter(w => {
        const matchesCategory = window.activeCategoryFilter === 'ALL' || w.category === window.activeCategoryFilter;
        const matchesSearch = w.title.toLowerCase().includes(searchQuery) || w.description.toLowerCase().includes(searchQuery) || w.categoryLabel.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 tabular-nums text-xs">No se encontraron métricas con ese criterio.</div>`;
        return;
      }

      filtered.forEach(item => {
        const isAssigned = window.activeSlots.includes(item.id);
        const div = document.createElement('div');
        div.className = "p-3 rounded-2xl border border-slate-200 hover:border-sky-400 bg-slate-50/50 hover:bg-white transition-all flex items-center justify-between gap-3 shadow-2xs";

        div.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-white border border-slate-200 text-slate-800 flex items-center justify-center font-bold text-sm shadow-xs flex-shrink-0">
              📊
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="tabular-nums text-[9px] font-bold px-2 py-0.5 rounded bg-sky-100 text-sky-800">${item.categoryLabel}</span>
                <span class="font-extrabold text-slate-900 text-xs">${item.title}</span>
              </div>
              <p class="text-[11px] text-slate-500 mt-0.5">${item.description}</p>
              <div class="mt-1 flex items-center gap-2 text-[10px] tabular-nums">
                <strong class="text-slate-800">${item.kpiHighlight}</strong>
                <span class="text-slate-400">• ${item.kpiSubtext}</span>
              </div>
            </div>
          </div>

          <button onclick="selectWidgetForSlot('${item.id}')" class="px-3.5 py-1.5 rounded-xl font-bold text-xs transition-all flex-shrink-0 ${isAssigned ? 'bg-slate-200 text-slate-700 hover:bg-sky-600 hover:text-white' : 'bg-slate-950 hover:bg-slate-800 text-white shadow-xs'}">
            ${isAssigned ? 'Reasignar' : 'Seleccionar'}
          </button>
        `;

        container.appendChild(div);
      });
    }

    window.selectWidgetForSlot = function(widgetId) {
      if (window.targetSlotForCatalog !== null) {
        window.activeSlots[window.targetSlotForCatalog] = widgetId;
        window.closeWidgetCatalog();
        window.renderSlots();
        showToast(`Métrica anclada en la ranura #${window.targetSlotForCatalog + 1}.`, 'success');
      }
    };

    window.clearSlot = function(slotIndex) {
      window.activeSlots[slotIndex] = null;
      window.renderSlots();
      showToast(`Ranura #${slotIndex + 1} liberada.`, 'info');
    };

    window.changeWidgetChartType = function(slotIndex) {
      const widgetId = window.activeSlots[slotIndex];
      const widgetDef = window.WIDGET_CATALOG.find(w => w.id === widgetId);
      if (!widgetDef) return;

      const types = ['bar', 'line', 'doughnut'];
      const currentIdx = types.indexOf(widgetDef.defaultType);
      widgetDef.defaultType = types[(currentIdx + 1) % types.length];

      window.renderSlots();
      showToast(`Tipo de gráfico cambiado a: ${widgetDef.defaultType.toUpperCase()}`, 'info');
    };

    window.filterCatalogCategory = function(cat) {
      window.activeCategoryFilter = cat;
      const btns = ['ALL', 'FIN', 'LOG', 'SALES'];
      btns.forEach(b => {
        const el = document.getElementById(`cat-btn-${b}`);
        if (el) {
          el.className = b === cat 
            ? "px-2.5 py-1 rounded-lg font-bold bg-white text-slate-900 shadow-xs" 
            : "px-2.5 py-1 rounded-lg font-semibold text-slate-600 hover:text-slate-900";
        }
      });
      renderCatalogList();
    };

    window.filterCatalogItems = function() {
      renderCatalogList();
    };

    // =======================================================
    // 6. ACCIONES GLOBALES Y PERSISTENCIA
    // =======================================================
    window.refreshAllWidgets = function() {
      window.renderSlots();
      showToast('Indicadores actualizados con datos en tiempo real.', 'success');
    };

    window.saveDashboardLayout = function() {
      const state = {
        gridConfig: window.currentGridConfig,
        activeSlots: window.activeSlots
      };
      localStorage.setItem('hl_bi_dashboard_studio', JSON.stringify(state));
      showToast('Plantilla personalizada guardada en memoria local.', 'success');
    };

    window.resetDefaultLayout = function() {
      localStorage.removeItem('hl_bi_dashboard_studio');
      window.activeSlots = [
        'WIDGET_CASH_FLOW',
        'WIDGET_BANK_AVAILABILITY',
        'WIDGET_COLLECTIONS_VS_PAYMENTS',
        'WIDGET_INVENTORY_ROTATION'
      ];
      window.setGridLayout('2x2');
      showToast('Lienzo restablecido a la configuración ejecutiva por defecto.', 'info');
    };

    window.updateGlobalPeriod = function(period) {
      showToast(`Horizonte temporal ajustado a: ${period}`, 'info');
      window.refreshAllWidgets();
    };

    window.exportBiReport = function() {
      showToast('Generando reporte consolidado de Business Intelligence...', 'info');
      setTimeout(() => {
        showToast('Reporte BI exportado exitosamente a PDF.', 'success');
      }, 1000);
    };

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-message');

      text.textContent = msg;
      if (type === 'success') {
        icon.textContent = '✓';
        toast.className = 'fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 bg-emerald-900 text-white border-emerald-700 text-xs font-bold';
      } else if (type === 'warning') {
        icon.textContent = '⚠️';
        toast.className = 'fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 bg-amber-900 text-white border-amber-700 text-xs font-bold';
      } else {
        icon.textContent = 'ℹ️';
        toast.className = 'fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 bg-slate-900 text-white border-slate-700 text-xs font-bold';
      }

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3500);
    }

    // =======================================================
    // 7. INICIALIZACIÓN
    // =======================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Cargar configuración guardada si existe
      try {
        const saved = localStorage.getItem('hl_bi_dashboard_studio');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.gridConfig && parsed.activeSlots) {
            window.activeSlots = parsed.activeSlots;
            window.setGridLayout(parsed.gridConfig);
            return;
          }
        }
      } catch (e) {
        console.warn('Error reading saved layout:', e);
      }

      window.setGridLayout('2x2');
    });
  </script>
</body>
</html>
